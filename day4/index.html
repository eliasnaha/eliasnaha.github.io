const COOKIE = "gi_gate";                 // convenience cache of the typed secret
const COOKIE_AGE = 60 * 60 * 24 * 30;     // ~30 days, refreshed on every unlock
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
function rememberPw(pw) {
  const secure = location.protocol === "https:" ? ";Secure" : "";
  document.cookie = COOKIE + "=" + encodeURIComponent(pw) +
    ";path=/;max-age=" + COOKIE_AGE + ";SameSite=Strict" + secure;
}
function rememberedPw() {
  const parts = document.cookie ? document.cookie.split("; ") : [];
  for (const p of parts) {
    if (p.indexOf(COOKIE + "=") === 0)
      return decodeURIComponent(p.slice(COOKIE.length + 1));
  }
  return null;
}
function forgetPw() {
  document.cookie = COOKIE + "=;path=/;max-age=0;SameSite=Strict";
}
async function keyFromPassword(pw) {
  const raw = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw),
    "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name:"PBKDF2", salt:b64(BLOB.salt), iterations:600000, hash:"SHA-256" },
    raw, { name:"AES-GCM", length:256 }, true, ["decrypt"]);
}
async function tryKey(key) {
  const pt = await crypto.subtle.decrypt({ name:"AES-GCM", iv:b64(BLOB.iv) }, key, b64(BLOB.ct));
  return new TextDecoder().decode(pt);
}
function show(html) {
  // document.write during parsing INSERTS instead of replacing (the "gate stuck
  // above the page" bug on refresh) — always wait until the document is fully
  // loaded, then rewrite it in standards mode.
  const write = () => {
    document.open();
    document.write("<!DOCTYPE html>\n" + html);
    document.close();
  };
  if (document.readyState === "complete") write();
  else window.addEventListener("load", write, { once: true });
}
async function unlock() {
  const btn = document.getElementById("go"), msg = document.getElementById("msg");
  btn.disabled = true; msg.textContent = "deriving key…";
  const pw = document.getElementById("pw").value;
  try {
    const key = await keyFromPassword(pw);
    const html = await tryKey(key);
    rememberPw(pw);                                 // carry across pages ~30d
    const jwk = await crypto.subtle.exportKey("jwk", key);
    sessionStorage.setItem("gi_gate_k", jwk.k);     // fast same-tab reload
    show(html);
  } catch (e) {
    btn.disabled = false; msg.textContent = "wrong password";
  }
}
document.getElementById("go").addEventListener("click", unlock);
document.getElementById("pw").addEventListener("keydown", e => { if (e.key === "Enter") unlock(); });
(async () => {   // silent unlock — never re-prompt while we still hold the secret
  // 1) fast path: this exact page's derived key, cached for this browser tab.
  const k = sessionStorage.getItem("gi_gate_k");
  if (k) {
    try {
      const key = await crypto.subtle.importKey("jwk",
        { kty:"oct", k, alg:"A256GCM", ext:true }, { name:"AES-GCM" }, true, ["decrypt"]);
      return show(await tryKey(key));
    } catch (e) { /* key belongs to another page or is stale — fall through */ }
  }
  // 2) cross-page path: re-derive THIS page's key from the remembered password.
  //    Each page has its own PBKDF2 salt, so the password — not the derived key —
  //    is what carries across pages. The encryption itself is unchanged.
  const pw = rememberedPw();
  if (pw == null) return;                           // nothing cached → show prompt
  try {
    const key = await keyFromPassword(pw);
    const html = await tryKey(key);
    const jwk = await crypto.subtle.exportKey("jwk", key);
    sessionStorage.setItem("gi_gate_k", jwk.k);
    rememberPw(pw);                                 // sliding 30-day refresh
    show(html);
  } catch (e) {
    forgetPw();                                     // rotated password → drop it, prompt
  }
})();
</script>
